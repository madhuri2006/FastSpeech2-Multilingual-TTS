transformer:
  encoder_layer: 2
  encoder_head: 2
  encoder_hidden: 128
  decoder_layer: 2
  decoder_head: 2
  decoder_hidden: 128
  conv_filter_size: 512
  conv_kernel_size:
  - 9
  - 1
  encoder_dropout: 0.1
  decoder_dropout: 0.1
variance_predictor:
  filter_size: 128
  kernel_size: 3
  dropout: 0.2
variance_embedding:
  pitch_quantization: linear
  energy_quantization: linear
  n_bins: 256
multi_speaker: true
max_seq_len: 2048
vocoder:
  model: HiFi-GAN
  speaker: LJSpeech
